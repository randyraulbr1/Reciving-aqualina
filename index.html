*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg) var(--pt) 0 0/420px 560px repeat;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
h1,.head b,.grp .top b{font-family:'Cormorant Garamond',Didot,'Bodoni 72',Georgia,serif}
main{padding:env(safe-area-inset-top) 16px calc(170px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:var(--gold);text-align:center;margin:26px 0 22px;padding-bottom:30px;position:relative}
.r1{position:relative;z-index:0;display:inline-block;margin:0 .32em 0 .26em}.r1 svg{position:absolute;left:50%;top:50%;width:1.95em;height:1.95em;transform:translate(-50%,-50%);z-index:-1}
h1 .eb{display:block;font-family:inherit;font-size:11px;letter-spacing:7px;font-weight:600;color:var(--gold);opacity:.9;margin:0 0 10px;padding-left:7px}
h1:before{content:'';position:absolute;left:50%;bottom:5px;width:calc(100% - 28px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold)) left center/calc(50% - 26px) 1px no-repeat,linear-gradient(90deg,var(--gold),transparent) right center/calc(50% - 26px) 1px no-repeat}
h1:after{content:'';position:absolute;left:50%;bottom:-12px;width:34px;height:34px;transform:translateX(-50%) rotate(45deg) scale(.45);background:var(--blue);border-radius:30% 30% 30% 30%;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--gold)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08);margin-bottom:14px}
label.t{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
input[type=text]{width:100%;border:0;background:transparent;font-size:19px;color:var(--text);outline:none;padding:4px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;transition:transform .1s,opacity .2s;margin-bottom:14px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.wa{background:var(--blue);margin:0;letter-spacing:.3px}
.btn.red{background:var(--card);color:var(--red);border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08)}
.head{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}
.hb{display:flex;align-items:center;gap:14px}#trash{color:var(--red)!important;display:flex;padding:2px}#dnumw{text-align:center}#dnumt{margin:0 0 8px!important;font-size:14px;color:var(--text)}#dnum{width:64px;text-align:center;font-size:24px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:8px;outline:none;margin-bottom:12px}#dnum:focus{border-color:var(--blue)}#dyes:disabled{opacity:.4}
.head b{font-size:20px}.head button{background:none;border:0;color:var(--gold);font-size:16px;cursor:pointer}.head #gofo,.head #goesp{padding:0;margin:0;border:0;background:none;font-size:16px;font-weight:600;color:var(--gold)}
.gesp{border:1px solid var(--red,#c8102e);background:var(--card);color:var(--red,#c8102e);border-radius:16px;padding:5px 12px;font-size:14px;font-weight:700;margin-right:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line);animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
*{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
.chk{position:absolute;left:6px;top:6px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.chk:before{content:"";position:absolute;inset:-8px}.ph.on .chk{background:var(--blue);border-color:var(--blue)}
.del{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--red,#c8102e);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}.del svg{width:14px;height:14px;pointer-events:none}
.bd{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;background:var(--gold)}
.bd.ok{background:var(--blue)}
.ph.sent img{opacity:.75}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.empty .big{color:var(--gold);opacity:.6}.empty .big .ic{width:64px;height:64px;stroke-width:1.2}
#totop{position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--red,#c8102e);padding:0;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:14}.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg) var(--ptd) 0 0/400px 150px repeat;border-top:0;padding-bottom:env(safe-area-inset-bottom)}
.dock:before{content:'';position:absolute;left:50%;top:0;width:calc(100% - 28px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--gold)) left center/calc(50% - 26px) 1px no-repeat,linear-gradient(90deg,var(--gold),transparent) right center/calc(50% - 26px) 1px no-repeat}
.dock:after{content:'';position:absolute;left:50%;top:0;width:15px;height:15px;transform:translate(-50%,-50%) rotate(45deg);background:var(--red);border-radius:4px;box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--gold)}
.send{padding:12px 16px 4px;display:flex;gap:10px}
.send .btn{flex:1;height:58px;margin:0;padding:0 8px;font-size:17px;letter-spacing:.3px}
.camb{background:var(--gold)!important}.camb.sp{background:var(--blue)!important;flex:none;width:auto;padding:0 14px;font-size:14px}
.tabs{display:flex}.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--muted);font-size:11px;cursor:pointer}
.tabs button span{font-size:22px}.tabs button.on{color:var(--blue)}
.tabs button{letter-spacing:.5px}
.tstack{position:fixed;left:10px;top:calc(56px + env(safe-area-inset-top));z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(260px,70vw)}
body:has(#cam.show) .tstack{top:calc(170px + env(safe-area-inset-top))}
.tc{display:flex;align-items:center;gap:9px;background:rgba(168,16,42,.96);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px 10px 10px;font-size:14px;line-height:1.25;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:tin .3s ease-out}
.tc.er{background:rgba(120,8,26,.97)}.tc.out{animation:tout .3s ease-in forwards}
.tc i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:#a8102a;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tc.er i{background:#fff;color:#a8102a}
@keyframes tin{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(-120%);opacity:0}}
.grp{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(120,90,40,.08)}
.grp .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.grp .top b{font-size:18px}.grp .top small{color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto}.strip img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.opt:last-child{border:0}
select,.selb{font-size:16px;border:0;background:var(--bg);color:var(--text);padding:8px 10px;border-radius:10px}
.sw{position:relative;width:51px;height:31px;flex:none}.sw input{display:none}
.sw i{position:absolute;inset:0;background:#c7c7cc;border-radius:16px;transition:.2s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--blue)}.sw input:checked+i:after{transform:translateX(20px)}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#cam.show{display:flex}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .ctl{height:130px;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);background:#000}
#shut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;position:relative}
#shut:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}
#shut:active:after{transform:scale(.85)}
#done{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:10px 20px;font-size:17px;font-weight:600}
#flip,#count{width:72px;color:#fff;font-size:15px;text-align:center;background:none;border:0}
#flip{font-size:30px}

 addEventListener('touchend',()=>{if(!act)return;act=false;el.style.transition='opacity .2s, transform .25s';
  if(pull>=65){el.classList.add('go');el.style.opacity=1;el.style.transform='translateY(48px)';
   try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})}catch(e){}
   setTimeout(()=>location.reload(),700)}
  else{el.style.opacity=0;el.style.transform='translateY(-60px)'}pull=0});
})();

$('send').onclick=()=>enviar();
addEventListener('offline',()=>draw());
async function bajaLista(){if(!navigator.onLine)return;try{const r=await fetch('empleados.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(Array.isArray(j.empleados)&&j.empleados.length&&(+j.v||0)!==(cfg.listaV||0)){cfg.empleados=j.empleados.map(x=>String(x).trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b));if(j.apts&&typeof j.apts==='object'){cfg.aprefs=j.apts.aprefs||{};cfg.aplock=j.apts.aplock||{}}cfg.listaV=+j.v;save();draw();return true}}catch(e){}return false}
setTimeout(bajaLista,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)bajaLista()});
addEventListener('online',()=>{bajaLista();draw();const q=photos.filter(p=>p.q).length;if(q){toast('Hay conexión: '+q+' en cola');try{if(window.Notification&&Notification.permission==='granted')new Notification('Receiving',{body:q+(cfg.idioma==='en'?' photo(s) ready to send':' foto(s) listas para enviar')})}catch(e){}}});
let persistido=false;if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(v=>v?v:navigator.storage.persist()).then(v=>{persistido=!!v;if(tab==='opc')draw()}).catch(()=>{})}
revisa2am();setInterval(revisa2am,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)revisa2am()});
open().then(d=>{db=d;return load()}).then(()=>{$('sptit').innerHTML=(cfg.empresa?`<small class="eb">${esc(cfg.empresa)}</small>`:'')+wordmark();setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),500);setTimeout(ayerCheck,300)},600)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
